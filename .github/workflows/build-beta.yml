name: Build NOURI Beta 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - Beta-2.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract NOURI Beta 2.0
        run: |
          unzip -o NOURI_BETA_2_0_SOURCE.zip -d .
          test -f settings.gradle
          test -f app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/nouri/assistant/MainActivity.java")
          s = p.read_text()
          old = 'private static final String GOLD = "#FFC15A";'
          new = 'private static final int GOLD = Color.parseColor("#FFC15A");'
          if old not in s:
              raise SystemExit("Expected GOLD definition not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOURI-BETA-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
